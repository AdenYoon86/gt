<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Ordering Prototype (CS6750 Individual Project)</title>
<style>
:root{--g:#00754A;--dg:#1E3932;--lg:#D4E9E2;--cream:#F2F0EB;--red:#C8102E}
*{box-sizing:border-box}
body{margin:0;background:#e9ece9;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--dg);display:flex;flex-direction:column;align-items:center;padding:12px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:10px;font-size:13px}
.ctl .grp{background:#fff;border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center}
.ctl button{border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.ctl button.on{background:var(--g);color:#fff}
.stage{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.ph{width:360px;height:720px;border:8px solid #1b1b1b;border-radius:40px;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
.sb{font-size:11px;color:#555;display:flex;justify-content:space-between;padding:8px 18px 2px}
.body{flex:1;overflow-y:auto;padding:6px 14px 10px}
h1{font-size:22px;margin:6px 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;text-align:center;border:1.5px solid var(--g);border-radius:20px;font-size:12px;padding:5px 0;color:var(--g);cursor:pointer}
.tab.on{background:var(--dg);border-color:var(--dg);color:#fff;font-weight:700}
.map{height:110px;border-radius:10px;background:#E6ECE8;position:relative;overflow:hidden;margin-bottom:8px;border:1px solid #c9d3cd}
.map::before{content:"";position:absolute;left:0;right:0;top:55%;height:9px;background:#fff}
.map::after{content:"";position:absolute;top:0;bottom:0;left:38%;width:9px;background:#fff}
.dot{position:absolute;z-index:2;width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.pin{position:absolute;z-index:2;width:13px;height:13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--g)}
.maplbl{position:absolute;z-index:2;font-size:10px;background:#fff;border:1px solid #bbb;padding:1px 4px;border-radius:3px}
.row{border:1.5px solid #d9dedb;border-radius:12px;padding:9px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer}
.row b{display:block;font-size:14px}.row small{color:#666;font-size:11px}
.btn{border:2px solid var(--g);color:var(--g);border-radius:50px;padding:5px 12px;font-size:12px;font-weight:700;background:#fff;white-space:nowrap;cursor:pointer;text-align:center}
.btn.fill{background:var(--g);color:#fff}
.btn.big{display:block;width:100%;padding:11px;font-size:15px;margin-top:8px}
.nav{height:48px;border-top:1px solid #d9dedb;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#777}
.nav span{cursor:pointer;padding:6px 10px}
.nav span.on{color:var(--g);font-weight:800;border-top:3px solid var(--g)}
.banner{border:2px solid var(--g);background:var(--lg);border-radius:14px;padding:12px;margin-bottom:10px}
.banner .t{font-size:12px;color:#456}.banner .s{font-size:19px;font-weight:800;margin:2px 0 2px}
.warn{border:2px solid var(--red);background:#FDECEE;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}
.warn .t{font-weight:800;font-size:15px;color:var(--red);margin-bottom:4px}
.card{border:1.5px solid #d9dedb;border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
.storebar{background:var(--dg);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.storebar b{font-size:16px;display:block}.storebar small{color:#cfe}
.storebar .chg{border:1.5px solid #fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.tinystore{font-size:11px;color:#777;margin-bottom:6px;display:flex;justify-content:space-between}
.tinystore u{cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3e7e4;padding:8px 0;font-size:13px}
.item small{color:#666}
.usual{border:2px solid var(--g);border-radius:12px;padding:10px;margin-bottom:10px;background:#f7fbf9}
.cart{position:sticky;bottom:0;background:#fff;padding-top:6px}
.side{width:300px;background:#fff;border-radius:14px;padding:12px;font-size:12px}
.side h3{margin:0 0 6px;font-size:14px}
.side .k{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:3px 0}
.log{max-height:240px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f6f6f6;padding:6px;border-radius:8px;margin-top:6px}
.ok{color:#0a7a3d;font-weight:700}.bad{color:var(--red);font-weight:700}
.small{font-size:11px;color:#666}
.hello{background:var(--lg);border-radius:14px;padding:14px;margin-bottom:10px}
.flow{width:100%;max-width:700px;background:#fff;border-radius:14px;padding:14px 16px;margin:0 auto 12px;font-size:14px;line-height:1.45}
.flow h2{margin:0 0 6px;font-size:18px}
.flow .step{display:inline-block;background:var(--lg);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.flow .task{border-left:4px solid var(--g);padding-left:10px;margin:6px 0}
.flow .go{display:inline-block;margin-top:8px;background:var(--g);color:#fff;border:0;border-radius:20px;padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.hide{display:none!important}
</style></head><body>
<div class="flow" id="flow"></div>
<div class="ctl" id="ctl">
  <div class="grp">Version: <button id="m-base">Current app</button><button id="m-new">Redesign</button></div>
  <div class="grp">Situation: <button id="s-1">1 · At the store (Tech Square)</button><button id="s-2">2 · Ordering ahead from home</button></div>
  <div class="grp"><button id="reset">Restart task</button></div>
</div>
<div class="stage">
  <div class="ph" id="phone"></div>
  <div class="side" id="side"></div>
</div>
<script>
// ---------- data (fictional distances; Georgia Tech scenario) ----------
const STORES={
 tech:{name:"Tech Square",sub:"Georgia Tech campus · 75 5th St NW",land:"Next to the Biltmore Hotel",hours:"Open until 7 PM"},
 buck:{name:"Buckhead Village",sub:"3035 Peachtree Rd NE",land:"Near the Buckhead Village shops",hours:"Open until 8 PM"},
 dec:{name:"Decatur Square",sub:"101 E Court Sq",land:"Facing the courthouse square",hours:"Open until 9 PM"},
 len:{name:"Lenox Square",sub:"3393 Peachtree Rd NE",land:"Inside the Lenox mall, Level 1",hours:"Open until 9 PM"}
};
const DIST={1:{tech:0,buck:4.9,dec:6.1,len:6.5},2:{tech:6.0,buck:7.5,dec:0.4,len:9.0}};
const MENU=[{id:"latte",n:"Iced Caffe Latte",p:5.45},{id:"brew",n:"Cold Brew",p:4.75},{id:"cro",n:"Butter Croissant",p:3.75}];
let S;
function fresh(keep){S={mode:keep?keep.mode:"base",scn:keep?keep.scn:1,screen:"home",tab:"Favorites",store:null,cart:[],taps:0,t0:null,log:[],done:false,warned:false,ready:false};}
fresh();
function d(k){return DIST[S.scn][k].toFixed(1)}
function mi(k){return DIST[S.scn][k]===0?"0 mi (you are here)":d(k)+" mi"}
const nearStore=()=>Object.keys(DIST[S.scn]).find(k=>DIST[S.scn][k]<=0.2)||null;
function logEv(t){const now=S.t0?((Date.now()-S.t0)/1000).toFixed(1):"0.0";S.log.push(now+"s  "+t)}
// ---------- lists ----------
function list(){
 const ks=Object.keys(STORES);
 if(S.mode==="base"){
   if(S.tab==="Nearby") return S.scn===1?["tech","buck","dec","len"]:["dec","tech","buck","len"];
   if(S.tab==="Previous") return S.scn===1?["tech","buck"]:["tech","dec"];
   return S.scn===1?["buck","dec","len"]:["dec","tech","buck"];     // favorites: far stores first, as observed
 }
 if(S.tab==="Favorites") return S.scn===1?["buck","dec","len"]:["tech","dec","buck"];
 if(S.tab==="Previous") return S.scn===1?["tech","buck"]:["tech","dec"];
 return ks.sort((a,b)=>DIST[S.scn][a]-DIST[S.scn][b]);
}
function rowHtml(k){return `<div class="row" data-a="pick" data-k="${k}"><div><b>${STORES[k].name}</b><small>${d(k)} mi · ${STORES[k].hours}</small></div><div class="btn">Order here</div></div>`}
function map(){const you=S.scn===1?'<div class="dot" style="left:150px;top:46px"></div><div class="maplbl" style="left:120px;top:72px">You are here · Georgia Tech</div><div class="pin" style="left:157px;top:44px"></div>':'<div class="dot" style="left:60px;top:70px"></div><div class="maplbl" style="left:30px;top:90px">You are here · home</div><div class="pin" style="left:240px;top:30px"></div>';return `<div class="map">${you}<div class="pin" style="left:300px;top:70px"></div></div>`}
// ---------- screens ----------
function screenHome(){return `<h1>Good morning</h1><div class="hello"><b>124 Stars</b><br><span class="small">76 more for your next reward</span></div><div class="card">Pick up your favorites<br><span class="small">Tap Order to start</span></div><div class="card">Offers: 2x Stars on cold drinks</div>`}
function screenOrder(){
 let h=`<h1>${S.mode==="base"?"Order · Pickup store":"Order"}</h1>`;
 if(S.mode==="new"){
   if(S.scn===1){const k=nearStore();h+=`<div class="banner"><div class="t">You are at</div><div class="s">${STORES[k].name}</div><div class="t">${STORES[k].sub}</div><div class="btn fill big" data-a="pick" data-k="${k}">Order here</div></div>`}
   else{h+=`<div class="banner"><div class="t">Your regular store</div><div class="s">Tech Square</div><div class="t">${d("tech")} mi away · ${STORES.tech.hours}</div><div class="btn fill big" data-a="pick" data-k="tech">Order ahead for pickup here</div></div>`}
   h+=`<div class="small" style="margin:4px 2px">${S.scn===1?"Other stores nearby":"Other stores"}</div>`;
   if(S.tab==="Favorites"&&false)S.tab="Nearby";
 }
 if(S.mode==="new"&&S.tab==="Favorites"&&!S.touched)S.tab="Nearby";
 h+=`<div class="tabs">${["Nearby","Previous","Favorites"].map(t=>`<div class="tab ${S.tab===t?"on":""}" data-a="tab" data-k="${t}">${t}</div>`).join("")}</div>`;
 if(S.mode==="base")h+=map();
 h+=list().filter(k=>!(S.mode==="new"&&((S.scn===1&&k==="tech")||(S.scn===2&&k==="tech")))).map(rowHtml).join("");
 return h;
}
function screenMenu(){
 const st=STORES[S.store];let h="";
 if(S.mode==="base")h+=`<div class="tinystore"><span>Pickup: ${st.name}</span><u data-a="change">change</u></div>`;
 else h+=`<div class="storebar"><div><small>Pickup at</small><b>${st.name}</b><small>${S.scn===1&&S.store==="tech"?"You are here · ":d(S.store)+" mi · "}${st.hours}</small></div><div class="chg" data-a="change">Change</div></div>`;
 h+=`<h1 style="font-size:18px">Menu</h1>`;
 if(S.mode==="new")h+=`<div class="usual"><b>Your usual</b><br>Iced Caffe Latte · Grande<br><span class="small">Ready in about 4 min at ${st.name}</span><div class="btn fill big" data-a="add" data-k="latte">Add your usual</div></div>`;
 h+=MENU.map(m=>`<div class="item"><div>${m.n}<br><small>$${m.p.toFixed(2)}</small></div><div class="btn" data-a="add" data-k="${m.id}">Add</div></div>`).join("");
 h+=`<div class="cart">${S.cart.length?`<div class="btn fill big" data-a="review">View order (${S.cart.length})</div>`:`<div class="small" style="text-align:center;padding:8px">Add an item to continue</div>`}</div>`;
 return h;
}
function screenReview(){
 const st=STORES[S.store],near=nearStore();
 const total=S.cart.reduce((a,id)=>a+MENU.find(m=>m.id===id).p,0);
 let h=`<h1 style="font-size:18px">Review order</h1>`;
 if(S.mode==="new"&&near&&near!==S.store&&!S.warnDismissed){
   S.warnShown=true;h+=`<div class="warn"><div class="t">Different store than where you are</div>You are at <b>${STORES[near].name}</b>, but this order is for <b>${st.name}</b> (${d(S.store)} mi away).<div class="btn fill big" data-a="fixstore" data-k="${near}">Order at ${STORES[near].name} instead</div><div class="btn big" data-a="keepstore">Keep ${st.name}</div></div>`;
 }
 if(S.mode==="new"){h+=`<div class="card"><b>Pickup store</b><br>${st.name}<br><span class="small">${st.sub} · ${st.land}</span></div>`}
 else h+=`<div class="card"><span class="small">Pickup</span> <span class="small">${st.name}</span></div>`;
 h+=S.cart.map(id=>{const m=MENU.find(x=>x.id===id);return `<div class="item"><div>${m.n}</div><div>$${m.p.toFixed(2)}</div></div>`}).join("");
 h+=`<div class="item"><b>Total</b><b>$${total.toFixed(2)}</b></div>`;
 const blocked=S.mode==="new"&&near&&near!==S.store&&!S.warnDismissed;
 h+=`<div class="btn fill big" ${blocked?'style="opacity:.45"':''} data-a="place">${S.mode==="new"?"Place order at "+st.name:"Place order"}</div>`;
 return h;
}
function screenDone(){const st=STORES[S.store];return `<h1>Order placed</h1><div class="card"><b>Thank you!</b><br>Pickup at <b>${st.name}</b><br><span class="small">${st.sub}</span></div><div class="small">The research panel shows the result of this task.</div>`}
function render(){
 const scr=S.screen;let body=scr==="home"?screenHome():scr==="order"?screenOrder():scr==="menu"?screenMenu():scr==="review"?screenReview():screenDone();
 const on=scr==="home"?"home":"order";
 document.getElementById("phone").innerHTML=`<div class="sb"><span>9:02</span><span>▮▮▮ 80%</span></div><div class="body">${body}</div><div class="nav"><span class="${on==="home"?"on":""}" data-a="nav" data-k="home">Home</span><span data-a="none">Scan</span><span class="${on==="order"?"on":""}" data-a="nav" data-k="order">Order</span><span data-a="none">Offers</span></div>`;
 ["base","new"].forEach(m=>document.getElementById("m-"+m).classList.toggle("on",S.mode===m));
 [1,2].forEach(n=>document.getElementById("s-"+n).classList.toggle("on",S.scn===n));
 side();if(typeof flow==="function"&&typeof P!=="undefined"&&P.idx>=0)flow();
}
function side(){if(!ADMIN&&false)return;
 const target="tech";let res="";
 if(S.done){const ok=S.store===target;res=`<div class="k"><span>Ordered at</span><b class="${ok?"ok":"bad"}">${STORES[S.store].name} ${ok?"✔ correct":"✘ wrong store"}</b></div>`}
 const task=S.scn===1?"Task 1: You are inside the Starbucks at Tech Square. Order your usual drink for pickup at the store you are in.":"Task 2: You are at home in Decatur. Order ahead your usual drink for pickup at your regular store, Tech Square.";
 document.getElementById("side").innerHTML=`<h3>Research panel</h3><div class="small" style="margin-bottom:6px">${task}</div><div class="k"><span>Version</span><b>${S.mode==="base"?"Current app":"Redesign"}</b></div><div class="k"><span>Taps</span><b>${S.taps}</b></div><div class="k"><span>Time to first order screen</span><b>${S.tFirst||"–"}</b></div>${res}<div class="small" style="margin-top:8px">Event log</div><div class="log">${S.log.join("<br>")||"(empty)"}</div>`;
}
// ---------- events ----------
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");
 if(t){act(t.dataset.a,t.dataset.k);return}
 const b=e.target.closest("button");
 if(!b)return;
 if(b.id==="reset")return(fresh(S),render());
 if(b.id==="m-base")return(fresh({mode:"base",scn:S.scn}),render());
 if(b.id==="m-new")return(fresh({mode:"new",scn:S.scn}),render());
 if(b.id==="s-1")return(fresh({mode:S.mode,scn:1}),render());
 if(b.id==="s-2")return(fresh({mode:S.mode,scn:2}),render());
});
function act(a,k){
 if(a==="none")return;
 if(S.done&&a!=="none")return;
 if(!S.t0)S.t0=Date.now();
 S.taps++;
 if(a==="nav"){logEv("nav "+k);S.screen=k;if(k==="order"&&!S.tFirst)S.tFirst=((Date.now()-S.t0)/1000).toFixed(1)+"s"}
 else if(a==="tab"){S.tab=k;S.touched=true;logEv("tab "+k)}
 else if(a==="pick"){S.store=k;S.screen="menu";S.warnDismissed=false;logEv("picked store: "+STORES[k].name)}
 else if(a==="change"){S.screen="order";logEv("change store")}
 else if(a==="add"){S.cart.push(k);logEv("add "+k)}
 else if(a==="review"){S.screen="review";logEv("review")}
 else if(a==="fixstore"){S.store=k;S.warnDismissed=false;logEv("warning: switched to "+STORES[k].name)}
 else if(a==="keepstore"){S.warnDismissed=true;logEv("warning: kept "+STORES[S.store].name)}
 else if(a==="place"){
   const near=nearStore();if(S.mode==="new"&&near&&near!==S.store&&!S.warnDismissed){logEv("place blocked by warning");render();return}
   S.done=true;S.tDone=((Date.now()-S.t0)/1000).toFixed(1);S.screen="done";logEv("PLACED at "+STORES[S.store].name)}
 render();
}

// ---------- participant flow ----------
const QS=new URLSearchParams(location.search);
const ADMIN=QS.get("admin")==="1";
const ORD=(QS.get("o")||"A").toUpperCase()==="B"?"B":"A";
const FORM_ID="u5ghSHuuJUuLem1_Mvqgg6srEbhhml1Iq0yH75-lli5UNlBXRkFUTVc5WE9WT0kzMzFXWjJKVDAxTC4u",FORM_Q="rbdcfdd1f19974fdcf2a973df528eca00";
const SEQ=ORD==="A"?[["base",1],["base",2],["new",1],["new",2]]:[["new",1],["new",2],["base",1],["base",2]];
const TASK={1:"You are inside the Starbucks at Tech Square on the Georgia Tech campus. Order your usual iced latte for pickup at the store you are in.",2:"You are at home in Decatur. Order ahead your usual iced latte for pickup at your regular store, Tech Square."};
const P={idx:-1,res:[]};
function verName(m){return m==="base"?"cur":"new"}
function startRun(){const [m,n]=SEQ[P.idx];fresh({mode:m,scn:n});S.t0=null;S.run=P.idx;render();flow()}
function flow(){
 const f=document.getElementById("flow");
 if(ADMIN){document.getElementById("ctl").classList.remove("hide");document.getElementById("side").classList.remove("hide");if(P.idx<0){f.classList.add("hide");return}}
 else{document.getElementById("ctl").classList.add("hide");document.getElementById("side").classList.add("hide")}
 f.classList.remove("hide");
 if(P.idx<0){f.innerHTML=`<h2>Coffee-ordering app: quick test</h2><p>Thank you for helping with my CS6750 project. You will try a <b>fictional</b> coffee-ordering app in two designs (Design X and Design Y) and do the same two tasks in each design (4 short tasks, about 5 minutes). Then you answer a few questions in a Microsoft Form. Taking part is voluntary and you can stop at any time. Nothing real is ordered, and no personal data is collected by this page.</p><p>Please use the app like you would use a real one. The page counts your taps and time.</p><button class="go" id="go">Start</button>`;document.getElementById("go").onclick=()=>{P.idx=0;startRun()};return}
 if(P.idx>=SEQ.length){
   const code="o="+ORD+";"+P.res.join(";");
   const url="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id="+FORM_ID+"&"+FORM_Q+"="+encodeURIComponent(code);
   f.innerHTML=`<h2>All done, thank you!</h2><p>Last step: a short Microsoft Form (about 2 minutes, Georgia Tech login). Your task results are filled in for you; please do not change that first answer.</p><a class="go" href="${url}" target="_blank" rel="noopener">Continue to the questions</a>`;
   document.querySelector(".stage").classList.add("hide");return}
 const [m,n]=SEQ[P.idx];const DN=m==="base"?"Design X":"Design Y";
 if(S.done){f.innerHTML=`<span class="step">Task ${P.idx+1} of ${SEQ.length} · ${DN}</span><h2>Order placed</h2><p>Nice. When you are ready, go on.</p><button class="go" id="next">${P.idx+1<SEQ.length?"Next task":"Finish"}</button>`;
  document.getElementById("next").onclick=()=>{const t=S.tFirst||"";const sec=S.tDone||"";P.res.push(`${verName(m)}-S${n}:store=${S.store},taps=${S.taps},sec=${sec},warn=${S.warnShown?1:0}`);P.idx++;if(P.idx<SEQ.length)startRun();else flow()};return}
 f.innerHTML=`<span class="step">Task ${P.idx+1} of ${SEQ.length} · ${DN}</span><div class="task">${TASK[n]}</div><div class="small">Tap on the phone below. Start from the Home screen.</div>`;
}
flow();
</script></body></html>
